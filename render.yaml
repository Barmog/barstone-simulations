# Render Static Site — סטודיו ההדמיות של Barstone.
# חיבור: Render › New › Blueprint › בחירת המאגר הזה. כל דחיפה ל-main נפרסת אוטומטית.
services:
  - type: web
    name: barstone-simulations
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

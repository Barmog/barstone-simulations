<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>רינדור · Barstone</title><link rel="stylesheet" href="css/studio.css?v=11">
<style>main{max-width:1100px;margin:auto;padding:16px}
.stage{direction:ltr;perspective:2200px;perspective-origin:50% 20%;height:620px;overflow:hidden;border-radius:16px;background:linear-gradient(#efe9df 0,#e6ddcf 45%,#cbbfae 46%,#b9ab97 100%);position:relative}
.world{position:absolute;left:50%;top:52%;transform-style:preserve-3d}
.floor{position:absolute;left:0;top:0;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:hidden;background-size:cover}
.top svg{background:none!important;box-shadow:none!important;overflow:visible}
.ctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:13px}.ctl input{width:160px}</style></head>
<body><header class="top"><img src="logo.png" alt="Barstone"><h1>רינדור הדמיה</h1><span class="sp"></span><a class="btn ghost" href="layout.html" style="text-decoration:none">חזרה לפריסה</a><a class="btn" href="document/document.html" style="text-decoration:none">למסמך ›</a></header>
<main><section class="panel"><h2>תצוגה פרספקטיבית מהפריסה שלך</h2><div class="ctl"><label>סיבוב <input type="range" id="rz" min="-60" max="60" value="-18"></label><label>זווית <input type="range" id="rx" min="20" max="75" value="58"></label><label>זום <input type="range" id="zm" min="50" max="160" value="100"></label><label><input type="checkbox" id="cab" checked> ארונות</label></div><div class="stage"><div class="world" id="w"><div class="floor" id="r"></div></div></div><div class="m" id="mm"></div>
<p style="font-size:12px;color:var(--mute)">תצוגה זו נוצרת מהפריסה בפועל — הטקסטורה לכל חלק נלקחת מהמיקום שלו בלוח. המשטחים מוצגים בתלת-ממד (עובי, קנט רציף וארונות) — זה עדיין לא רינדור פוטוריאליסטי.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/store.js?v=11"></script><script src="js/engine.js?v=11"></script><script src="js/views.js?v=11"></script>
<script>(async()=>{const S=SimStore,sim=S.getSim();if(!sim||!sim.length_cm){r.innerHTML='<p>אין עדיין הדמיה — <a href="dimensions.html">להתחלה</a></p>';return}
const st=await S.stones(),stone=st.find(s=>String(s.id)===String(sim.stone_id))||st[0],tex=S.texture(stone);
const res=StoneEngine.run(sim,S.getBoards(),{edgeH:sim.edge_mm||40,kerf:sim.kerf_mm||4});res.sim=sim;const m=res.metrics;
const P=res.pieces.filter(p=>p.plan),R=P.map(p=>({p,...StoneEngine.planRect(p,p.plan.x,p.plan.y)}));
const VW=Math.max(...R.map(q=>q.x+q.w)),VH=Math.max(...R.map(q=>q.y+q.h)),k=760/Math.max(VW,VH*1.3);
const th=Math.max(+sim.thickness_cm*10||20,(sim.edge?(+sim.edge_mm||40):0))*k,cabH=870*k,esc=StoneViews.esc;
// משטח עליון: תוכנית ה-2D האמיתית (טקסטורה מהמיקום בלוח), ממופה על הרצפה הווירטואלית
const svg=StoneViews.planSVG(res,tex,(VW+240)*k);
const face=(x,y,w,hh,t,bg,extra='')=>`<div class="face" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;transform-origin:0 0;transform:${t};background:${bg};${extra}"></div>`;
function build(){let g=`<div class="top" style="position:absolute;left:${-120*k}px;top:${-120*k}px;transform:translateZ(${th+(cab.checked?cabH:0)}px)">${svg}</div>`;
const z0=cab.checked?cabH:0,stoneBg=`url('${tex}') center/400px`,cabBg='linear-gradient(90deg,#f4f1ec,#e7e1d8)';
for(const q of R){const x=q.x*k,y=q.y*k,w=q.w*k,h=q.h*k;
 // קנט רציף: פאות העובי בטקסטורת האבן, ארון מתחת
 const sides=[[x,y+h,w,'rotateX(-90deg)'],[x+w,y+h,h,'rotateZ(-90deg) rotateX(-90deg)'],[x,y,h,'rotateZ(90deg) rotateX(-90deg)'],[x+w,y,w,'rotateZ(180deg) rotateX(-90deg)']];
 for(const[sx,sy,len,rot]of sides){g+=face(sx,sy,len,th,`translateZ(${z0+th}px) ${rot}`,stoneBg,'filter:brightness(.88)');
  if(cab.checked)g+=face(sx,sy,len,cabH-6,`translateZ(${cabH}px) ${rot} translateY(0)`,cabBg,`box-shadow:inset 0 -10px 0 #3a332a, inset 0 0 0 1px rgba(0,0,0,.06);background-image:${cabBg},repeating-linear-gradient(90deg,transparent 0 ${600*k-2}px,rgba(0,0,0,.18) ${600*k-2}px ${600*k}px)`);}
}
g+=`<div style="position:absolute;left:${-200*k}px;top:${-200*k}px;width:${(VW+400)*k}px;height:${(VH+400)*k}px;background:radial-gradient(rgba(60,48,30,.25),transparent 70%);transform:translateZ(-1px)"></div>`;
r.innerHTML=g;view()}
function view(){r.style.width=VW*k+'px';w.style.transform=`scale(${zm.value/100}) rotateX(${rx.value}deg) rotateZ(${rz.value}deg) translate(${-VW*k/2}px,${-VH*k/2}px)`}
[rx,rz,zm].forEach(e=>e.oninput=view);cab.onchange=build;build();
mm.innerHTML=[['אבן',stone.name],['לוחות',m.boards],['ניצולת',m.utilization+'%'],['צריכה',m.consumed_m2+' מ"ר']].map(([a,b])=>`<div><small>${a}</small><b>${esc(b)}</b></div>`).join('')})()</script>
<script src="js/flow.js?v=11"></script></body></html>

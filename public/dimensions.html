<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EEE7"><title>מידות · Barstone</title><link rel="stylesheet" href="css/studio.css?v=15">
<style>
.dm{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.hero h2{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:10px 0 4px}.hero p{color:var(--mute);margin:0 0 18px;font-size:15px}
.grp{background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:16px;margin:0 0 14px;box-shadow:0 10px 40px rgba(60,48,30,.07),inset 0 0 0 .5px rgba(0,0,0,.06)}
.grp h3{font-size:13px;letter-spacing:.04em;color:var(--mute);font-weight:600;margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>*{min-width:0}.g2 .full{grid-column:1/-1}
.g2 label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
.g2 input,.g2 select{min-height:46px;font-size:16px;border-radius:14px;padding:10px 12px}
.sw{display:flex!important;flex-direction:row!important;justify-content:space-between;align-items:center;min-height:48px;color:var(--ink)!important;font-size:15px!important}
.sw input{appearance:none;-webkit-appearance:none;width:51px!important;height:31px;min-height:0!important;border-radius:999px;background:#e3ddd4;position:relative;transition:background .25s;box-shadow:none;padding:0;cursor:pointer;flex:none}
.sw input:after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked{background:#34C759}.sw input:checked:after{transform:translateX(-20px)}
.dep{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-column:1/-1;overflow:hidden;transition:opacity .25s}
.grp:not(:has(input[name=sink]:checked)) .dep.sink,.grp:not(:has(input[name=cooktop]:checked)) .dep.cook{display:none}
#pv{border-radius:16px;overflow:hidden;min-height:120px;display:grid;place-items:center;color:var(--mute);font-size:14px}#pv svg{width:100%;height:auto}
.cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:4;margin-top:6px}.cta button{width:100%;min-height:54px;border-radius:18px;font-size:17px;font-weight:600;box-shadow:0 14px 30px -10px rgba(27,26,24,.5)}
#list{list-style:none;padding:0;margin:0;font-size:14px}#list li{padding:10px 0;border-bottom:.5px solid var(--line)}#preview{display:none}
.st{font-size:12px;color:var(--mute)}@media(min-width:900px){.cta{bottom:84px}}
</style></head><body>
<header class="top"><img src="logo.png" alt="Barstone"><h1>מידות</h1><span class="sp"></span><span id="status" class="st">טוען…</span></header>
<main class="dm">
<div class="hero"><h2>בואו נמדוד את המטבח</h2><p>הזינו מידות בסנטימטרים. אפשר לשנות הכול גם בשלב הפריסה.</p></div>
<section class="grp"><h3>התחלה מהירה</h3><div class="g2"><label class="full">טעינת דוגמה<select id="samples"><option>טוען…</option></select></label></div></section>
<form id="dims">
<section class="grp"><h3>לקוח ואבן</h3><div class="g2">
 <label class="full">שם לקוח<input name="client_name" required autocomplete="name" placeholder="למשל: משפחת כהן"></label>
 <label class="full">סוג אבן<select name="stone_id" id="stones"></select></label></div></section>
<section class="grp"><h3>משטחים</h3><div class="g2">
 <label>אורך משטח<input name="length_cm" type="number" step="any" inputmode="decimal" required placeholder="ס״מ"></label>
 <label>עומק<input name="depth_cm" type="number" step="any" inputmode="decimal" value="60" required></label>
 <label>עובי<input name="thickness_cm" type="number" inputmode="decimal" value="2" step="any"></label>
 <label>משטח L (0 = אין)<input name="l_length_cm" type="number" step="any" inputmode="decimal" value="0"></label>
 <label>עומק L<input name="l_depth_cm" type="number" inputmode="decimal" step="any" placeholder="כמו הראשי"></label>
 <label>אי · אורך<input name="island_l_cm" type="number" step="any" inputmode="decimal" value="0"></label>
 <label>אי · רוחב<input name="island_w_cm" type="number" step="any" inputmode="decimal" value="90"></label></div></section>
<section class="grp"><h3>כיור וכיריים</h3><div class="g2">
 <label class="sw full">כיור<input type="checkbox" name="sink"></label>
 <div class="dep sink">
  <label class="full">סוג כיור<select name="sink_type"><option value="bought">כיור קנוי (תחתון / שטוח) — פתח בלבד</option><option value="stone">כיור בנוי מאבן</option></select></label>
  <label class="full">מיקום כיור<select name="sink_piece"><option value="A">משטח ראשי</option><option value="B">משטח L</option><option value="C">אי</option></select></label>
  <label>רוחב<input name="sink_w_cm" type="number" step="any" inputmode="decimal" value="60"></label>
  <label>עומק<input name="sink_d_cm" type="number" step="any" inputmode="decimal" value="40"></label>
  <label class="full">מרכז מתחילת החלק<input name="sink_x_cm" type="number" step="any" inputmode="decimal" min="0" placeholder="אמצע (אוטומטי)"></label>
  <label class="sw full">כיור כפול<input type="checkbox" name="sink_double"></label></div>
 <label class="sw full">פתח כיריים<input type="checkbox" name="cooktop"></label>
 <div class="dep cook">
  <label class="full">מיקום כיריים<select name="cooktop_piece"><option value="A">משטח ראשי</option><option value="B">משטח L</option><option value="C">אי</option></select></label>
  <label>רוחב<input name="cooktop_w_cm" type="number" step="any" inputmode="decimal" value="56"></label>
  <label>עומק<input name="cooktop_d_cm" type="number" step="any" inputmode="decimal" value="49"></label></div>
</div></section>
<section class="grp"><h3>תצוגה מקדימה</h3><div id="pv">הזינו אורך משטח</div><canvas id="preview" width="800" height="300"></canvas></section>
<div class="cta"><button class="btn">המשך לפריסת שיש ›</button></div>
</form>
<section class="grp" style="margin-top:14px"><h3>הדמיות שמורות</h3><ul id="list"></ul></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/store.js?v=15"></script><script src="js/engine.js?v=15"></script><script src="js/views.js?v=15"></script>
<script type="module" src="js/app.js?v=15"></script><script src="js/samples.js?v=15"></script><script src="js/flow.js?v=15"></script>
<script>
// תצוגה מקדימה חיה: אותו מנוע ואותה תוכנית כמו בשלב הפריסה
(function(){const f=document.getElementById('dims'),pv=document.getElementById('pv');let t,stones=null;
 async function up(){const prev=SimStore.getSim()||{},s={...prev};for(const el of f.querySelectorAll('[name]'))s[el.name]=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?'':+el.value):el.value;
  if(!(+s.length_cm>0)){pv.textContent='הזינו אורך משטח';return}stones=stones||await SimStore.stones();const st=stones.find(x=>String(x.id)===String(s.stone_id))||stones[0];
  const r=StoneEngine.run(s,SimStore.getBoards(),{edgeH:s.edge_mm||40,kerf:s.kerf_mm||4});r.sim=s;pv.innerHTML=StoneViews.planSVG(r,SimStore.texture(st),pv.clientWidth||340)}
 f.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(up,150)});f.addEventListener('change',()=>{clearTimeout(t);t=setTimeout(up,50)});setTimeout(up,900);})();
</script></body></html>

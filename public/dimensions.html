<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barstone — הדמיות</title><link rel="stylesheet" href="css/app.css"></head><body>
<header><h1>Barstone · הדמיות מטבח</h1><span id="status">טוען…</span></header>
<main>
<section class="card"><h2>1. מידות</h2>
<form id="dims"><label>שם לקוח <input name="client_name" required></label>
<label>אורך משטח (ס"מ) <input name="length_cm" type="number" required></label>
<label>עומק (ס"מ) <input name="depth_cm" type="number" value="60" required></label>
<label>עובי (ס"מ) <input name="thickness_cm" type="number" value="2"></label>
<label>סוג אבן <select name="stone_id" id="stones"></select></label>
<button>שמור והמשך לפריסת שיש ›</button></form></section>
<section class="card"><h2>2. פריסת שיש / תצוגה</h2><canvas id="preview" width="800" height="300"></canvas></section>
<section class="card"><h2>3. הדמיות שמורות</h2><ul id="list"></ul></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script type="module" src="js/app.js"></script><script src="js/flow.js"></script></body></html>

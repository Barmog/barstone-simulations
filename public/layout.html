<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פריסת שיש · Barstone</title><link rel="stylesheet" href="css/studio.css?v=9"></head><body>
<header class="top"><img src="logo.png" alt="Barstone"><h1>פריסת שיש</h1><span class="sp"></span><span id="sb" style="font-size:12px;color:var(--mute)"></span>
<button class="btn ghost" id="toDoc">מסמך ללקוח</button><button class="btn" id="save">שמירה</button></header>
<div class="wrap">
<aside class="panel">
  <h2>מידות</h2>
  <div class="f" id="form">
    <label class="full">שם לקוח<input name="client_name"></label>
    <label>אורך משטח (ס"מ)<input name="length_cm" type="number" value="300"></label>
    <label>עומק (ס"מ)<input name="depth_cm" type="number" value="62"></label>
    <label>משטח L (ס"מ)<input name="l_length_cm" type="number" value="0"></label>
    <label>חיפוי גובה (ס"מ)<input name="splash_h_cm" type="number" value="0"></label>
    <label>אי אורך (ס"מ)<input name="island_l_cm" type="number" value="0"></label>
    <label>אי רוחב (ס"מ)<input name="island_w_cm" type="number" value="90"></label>
    <label>עובי (ס"מ)<input name="thickness_cm" type="number" value="2" step="0.1"></label>
    <label>סוג אבן<select name="stone_id" id="stone"></select></label>
    <label class="chk full"><input type="checkbox" name="edge" checked> קנט רציף מהלוח (חובה)</label>
    <label>קנט (מ"מ)<input name="edge_mm" type="number" value="40"></label>
    <label>עובי מסור (מ"מ)<input name="kerf_mm" type="number" value="4"></label>
    <label class="chk full"><input type="checkbox" name="sink"> כיור בנוי מאבן</label>
    <label>כיור רוחב<input name="sink_w_cm" type="number" value="60"></label>
    <label>כיור עומק<input name="sink_d_cm" type="number" value="40"></label>
    <label>כיור גובה<input name="sink_h_cm" type="number" value="20"></label>
  </div>
  <h2 style="margin-top:18px">ערימת לוחות</h2>
  <div class="f">
    <label>מזהה לוח מפעל<input id="bId" placeholder="BS-1001"></label>
    <label>מידה (מ"מ)<input id="bSize" value="3200×1600"></label>
  </div>
  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
    <button class="btn ghost" id="addB">+ הוספה ידנית</button>
    <label class="btn ghost" style="display:inline-block">📷 מתמונה<input type="file" accept="image/*" capture="environment" id="photo" hidden></label>
  </div>
  <ul class="stack" id="stack"></ul>
  <p style="font-size:11px;color:var(--mute)">לחיצה על לוח בתצוגה העליונה מסמנת פגם (20×20 ס"מ). הלוחות נשמרים במכשיר.</p>
</aside>
<main class="views">
  <section class="panel view"><h3>לוחות <small id="bcap"></small></h3><div class="boards" id="boards"></div>
  <div class="legend"><span><i style="background:var(--edge)"></i>קנט</span><span><i style="background:var(--cut)"></i>חיתוך + מסור</span><span><i style="background:var(--err)"></i>פגם</span><span><i style="background:var(--grain)"></i>כיור</span></div></section>
  <section class="panel view"><h3>תוכנית 2D <small>גררו חלקים למיקום · הטקסטורה נלקחת מהמיקום בלוח · <a href="#" id="resetPos" style="color:#8a6d3b">איפוס מיקומים</a></small></h3><div id="plan"></div></section>
</main>
<aside class="panel side">
  <h2>בדיקה</h2><div class="m" id="metrics"></div><div id="warn"></div>
  <h2 style="margin-top:16px">חלקים</h2><ul class="list" id="parts"></ul>
</aside></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/store.js?v=9"></script><script src="js/engine.js?v=9"></script><script src="js/views.js?v=9"></script><script src="js/studio.js?v=9"></script><script src="js/flow.js?v=9"></script>
</body></html>

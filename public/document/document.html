@import url(https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500&family=JetBrains+Mono:wght@500&display=swap);
@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;font-family:Heebo,sans-serif;color:#1B1A18;background:#EDE6DC;-webkit-font-smoothing:antialiased}
.doc{max-width:430px;margin:0 auto}.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.ks{position:absolute;width:6px;top:94px;height:92px;background:rgba(224,66,143,.55)}.vein{position:absolute;height:4px;border-radius:3px;background:linear-gradient(90deg,transparent,#C4AA80 15%,#B49B74 85%,transparent);box-shadow:0 0 10px rgba(196,170,128,.9)}.wall{position:absolute;left:10px;top:20px;width:375px;height:5px;background:#1B1A18}
.cap{font-size:13px;color:#8C857B}.kv{display:flex;justify-content:space-between;padding:13px 0;border-bottom:.5px solid rgba(27,26,24,.1);font-size:15.5px}.kv span{color:#6B645C}

.lg{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px;margin-top:10px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px}

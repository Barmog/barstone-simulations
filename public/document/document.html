<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>מסמך הדמיה · Barstone</title><style>
@import url(https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap);
*{box-sizing:border-box}body{margin:0;font-family:Heebo,system-ui,sans-serif;color:#1B1A18;background:#ECE6DD;-webkit-font-smoothing:antialiased}
.doc{max-width:820px;margin:0 auto;padding:16px 14px 40px}.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;margin-bottom:6px;background:rgba(236,230,221,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bar a{color:#3a3530;text-decoration:none;font-size:14px}.bar button{border:0;border-radius:999px;padding:0 20px;min-height:42px;background:#1B1A18;color:#fff;font:500 14px Heebo;cursor:pointer}
.pg{background:linear-gradient(175deg,#FFFEFC,#F8F4EE);border-radius:26px;margin:0 0 16px;padding:34px 38px;box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 20px 50px -30px rgba(60,48,30,.35)}
.cover{min-height:min(1100px,92vh);display:flex;flex-direction:column;background:radial-gradient(520px 360px at 90% 0%,#fff,transparent 60%),linear-gradient(170deg,#F8F4EE,#E8DDCF)}
.top{display:flex;justify-content:space-between;align-items:center}.logo{height:22px}.eb{font-size:12px;letter-spacing:.14em;color:#9C8360;font-weight:600}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:52px;line-height:1.05;margin:40px 0 8px;letter-spacing:-.01em;overflow-wrap:anywhere}
.lead{font-size:18px;color:#6B645C;margin:0}.cv-img{flex:1;min-height:300px;border-radius:24px;background:center/cover;margin:28px 0;position:relative;box-shadow:0 30px 50px -24px rgba(60,48,30,.5);overflow:hidden}
.cv-img:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.45),transparent 45%,rgba(60,48,30,.15))}.cv-img span{position:absolute;bottom:16px;right:16px;z-index:2;font-size:13px;background:rgba(255,255,255,.88);padding:6px 12px;border-radius:999px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meta div{padding:14px;border-radius:16px;background:rgba(255,255,255,.7);box-shadow:0 0 0 .5px rgba(27,26,24,.08)}.meta small{display:block;font-size:12px;color:#8C857B}.meta b{font-size:17px;font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#8C857B;margin-bottom:20px;border-bottom:.5px solid rgba(27,26,24,.14);padding-bottom:12px}.ph img{height:14px}
h2{font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:32px;margin:0 0 12px}.h3{font-size:16px;font-weight:600;margin:24px 0 10px}.p{font-size:15px;line-height:1.65;color:#4A453F}
.kvs{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.kv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:.5px solid rgba(27,26,24,.1);font-size:15px}.kv span{color:#6B645C}.kv b{font-weight:600;text-align:left}
.fig{margin:12px 0;text-align:center}.fig svg{max-width:100%;height:auto}figcaption{font-size:12.5px;color:#8C857B;margin-top:6px}
.lg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:#4A453F;margin:6px 0 4px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 14px}.tb{width:100%;font-size:14px;border-collapse:collapse}.tb th{text-align:right;font-weight:500;color:#8C857B;font-size:12px;padding:8px 6px;border-bottom:1px solid #d9d2c7;white-space:nowrap}.tb td{padding:9px 6px;border-bottom:.5px solid #e7e1d8;vertical-align:top}.tb tr:nth-child(even) td{background:rgba(27,26,24,.02)}
.bad{color:#B4282E}.warn{background:#FDF0EF;color:#8E2A2E;border-radius:16px;padding:14px 18px;font-size:14px;margin:18px 0 0;box-shadow:inset 0 0 0 .5px rgba(180,40,46,.2)}.warn ul{margin:6px 0 0;padding-inline-start:18px}.warn.ok{background:#EEF7F1;color:#1F6B44;box-shadow:inset 0 0 0 .5px rgba(31,107,68,.2)}
.ul{padding-inline-start:20px;font-size:14.5px;line-height:1.8;color:#4A453F}.note{font-size:12.5px;color:#8C857B;line-height:1.6}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}.sig{padding:18px;border-radius:18px;background:rgba(255,255,255,.75);box-shadow:0 0 0 .5px rgba(27,26,24,.12);display:flex;flex-direction:column;gap:4px;font-size:13px;color:#6B645C}.sig small{font-size:12px;font-weight:600;color:#1B1A18}.line{height:64px;border-bottom:1px solid #1B1A18;margin-bottom:6px}
.foot{text-align:center;font-size:11.5px;color:#8C857B;margin-top:30px}
@media(max-width:600px){.doc{padding:8px 8px 30px}.pg{padding:24px 18px;border-radius:22px}h1{font-size:38px;margin-top:28px}h2{font-size:26px}.meta{grid-template-columns:1fr 1fr}.kvs,.sigs{grid-template-columns:1fr}.cover{min-height:auto}.cv-img{min-height:240px}.tb{font-size:13px}}
@page{size:A4;margin:12mm}
@media print{body{background:#fff}#bs-flow,.no-print{display:none!important}.doc{max-width:none;padding:0}.pg{box-shadow:none;border-radius:0;background:#fff;padding:0;margin:0;break-after:page}.pg:last-child{break-after:auto}
.cover{min-height:270mm;background:#fff}.cv-img{min-height:110mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tb tr,.fig,.sig,.warn,.kv{break-inside:avoid}h2,.h3{break-after:avoid}
.brd .fig{margin:1.5mm 0}.brd table{break-inside:avoid}.brd h2{break-after:avoid}.brd .fig svg{width:auto!important;height:50mm!important;max-width:100%}.brd .p{margin:2mm 0}.ph{margin-bottom:6mm}.pg:not(.brd) .fig svg{max-height:118mm;width:auto!important;max-width:100%;margin:0 auto;display:block}}
</style></head><body><div class="doc" id="doc"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script><script src="../js/store.js?v=15"></script><script src="../js/engine.js?v=15"></script><script src="../js/views.js?v=15"></script><script src="../js/document.js?v=15"></script><script src="../js/flow.js?v=15"></script></body></html>

<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>רינדור · Barstone</title><link rel="stylesheet" href="css/studio.css?v=7">
<style>main{max-width:1200px;margin:auto;padding:16px}#c{width:100%;height:640px;display:block;border-radius:16px;background:#e9e3da;touch-action:none}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:13px}.ctl select{padding:6px 10px;border-radius:10px;border:1px solid #ddd}.cr{font-size:11px;color:var(--mute);margin-top:8px}</style></head>
<body><header class="top"><img src="logo.png" alt="Barstone"><h1>רינדור הדמיה</h1><span class="sp"></span><a class="btn ghost" href="layout.html" style="text-decoration:none">חזרה לפריסה</a><a class="btn" href="document/document.html" style="text-decoration:none">למסמך ›</a></header>
<main><section class="panel"><h2>הדמיה תלת-ממדית מהפריסה שלך</h2>
<div class="ctl"><label>אבן <select id="st"></select></label><label><input type="checkbox" id="cab" checked> ארונות</label><label>תאורה <select id="lt"><option value="day">אור יום</option><option value="warm">חם (ערב)</option><option value="studio">סטודיו</option></select></label><button class="btn ghost" id="shot">צילום תמונה</button><span id="st8" style="color:var(--mute)">טוען…</span></div>
<canvas id="c"></canvas><div class="m" id="mm"></div>
<p class="cr">גררו לסיבוב · גלגלת/צביטה לזום. הטקסטורה של כל משטח וקנט נלקחת מהמיקום שלו בלוח (קנט רציף). תאורה והשתקפויות מחושבות בדפדפן (Three.js) — הדמיה, לא צילום.</p><p class="cr" id="cred"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/store.js?v=7"></script><script src="js/engine.js?v=7"></script><script src="js/views.js?v=7"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const S=SimStore,sim=S.getSim(),$=(q)=>document.querySelector(q),esc=StoneViews.esc;
if(!sim||!sim.length_cm){$('main').innerHTML='<p class="panel">אין עדיין הדמיה — <a href="dimensions.html">להתחלה</a></p>';throw 0}
const stones=await S.stones();$('#st').innerHTML=stones.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
$('#st').value=String(sim.stone_id||stones[0].id);if(!$('#st').value)$('#st').value=String(stones[0].id);
const CR={'stones/v3/carrara.jpg':'James St. John · CC BY 2.0','stones/v3/statuario.jpg':'James St. John · CC BY 2.0','stones/v3/taj.jpg':'James St. John · CC BY 2.0','stones/v3/connemara.jpg':'James St. John · CC BY 2.0','stones/v3/black.jpg':'James St. John · CC BY 2.0','stones/v3/onyx.jpg':'Kevin Walsh · CC BY 2.0','stones/v3/calacatta.jpg':'Stones slabs · CC BY-SA 4.0'};
const cv=$('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,devicePixelRatio));
R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;scene.background=new THREE.Color('#e9e3da');
const cam=new THREE.PerspectiveCamera(38,1,.05,60),ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*.49;
const hemi=new THREE.HemisphereLight('#fffaf0','#8a7a66',.5),sun=new THREE.DirectionalLight('#ffffff',2.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
const lamps=new THREE.Group();scene.add(hemi,sun,sun.target,lamps);
const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');const cache={};
const loadTex=(u)=>cache[u]||(cache[u]=new Promise(r=>loader.load(u,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=R.capabilities.getMaxAnisotropy();r(t)},undefined,()=>r(null))));
const root=new THREE.Group();scene.add(root);
const mm=.001,TH=()=>Math.max(+sim.edge_mm||40,(+sim.thickness_cm||2)*10);
function region(t,bw,bh,x,y,w,h,rot){const c=t.clone();c.needsUpdate=true;c.wrapS=c.wrapT=THREE.ClampToEdgeWrapping;
  // מיפוי אזור (x,y,w,h) בלוח (מ"מ, y למטה) לפאה; תמונת הלוח נמתחת על כל הלוח (כמו בתצוגת 2D)
  c.repeat.set(w/bw,h/bh);c.offset.set(x/bw,1-(y+h)/bh);if(rot){c.center.set(.5,.5);c.rotation=Math.PI/2}return c}
async function build(){
  $('#st8').textContent='טוען טקסטורה…';root.clear();
  const stone=stones.find(s=>String(s.id)===$('#st').value)||stones[0];sim.stone_id=stone.id;S.setSim(sim);
  $('#cred').textContent=stone.tile_path&&CR[stone.tile_path]?`צילום אבן: ${CR[stone.tile_path]} (Wikimedia Commons)`:stone.tile_path?'טקסטורה: ambientCG · CC0':'';
  const res=StoneEngine.run(sim,S.getBoards(),{edgeH:sim.edge_mm||40,kerf:sim.kerf_mm||4}),o=res.opts,th=TH();
  const base=await loadTex(S.texture(stone));let maxX=0,maxZ=0;
  for(const u of res.used){const bw=u.board.w||o.boardW,bh=u.board.h||o.boardH,bt=u.board.tex?await loadTex(u.board.tex):base;
   for(const p of u.place){const b=p.block,pc=b.piece;if(!pc.plan)continue;
    const rotPlan=!!pc.rot,x0=pc.plan.x+(rotPlan?0:b.offsetL),z0=pc.plan.y+(rotPlan?b.offsetL:0),w=rotPlan?b.W:b.L,d=rotPlan?b.L:b.W;
    const mat=(m)=>new THREE.MeshPhysicalMaterial({map:m,roughness:.12,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:1.1,color:m?'#fff':'#ddd'});
    const top=bt&&region(bt,bw,bh,p.x,p.y,b.L,b.W,p.rot),edge=bt&&region(bt,bw,bh,p.x,p.y+b.W+o.kerf,b.L,o.edgeH,p.rot);
    const side=bt&&region(bt,bw,bh,p.x,p.y,o.edgeH,b.W,p.rot);
    // סדר פאות BoxGeometry: +x,-x,+y(עליון),-y,+z(חזית=קנט),-z
    const mats=[mat(side),mat(side),mat(top),mat(top),mat(edge),mat(edge)];
    const m=new THREE.Mesh(new THREE.BoxGeometry(b.L*mm,th*mm,b.W*mm),mats);m.castShadow=m.receiveShadow=true;
    const cy=(cab.checked?.87:0)+th*mm/2;
    if(rotPlan){m.rotation.y=-Math.PI/2;m.position.set((x0+w/2)*mm,cy,(z0+d/2)*mm)}else m.position.set((x0+w/2)*mm,cy,(z0+d/2)*mm);
    root.add(m);maxX=Math.max(maxX,x0+w);maxZ=Math.max(maxZ,z0+d);
    if(cab.checked){const cm=new THREE.MeshPhysicalMaterial({color:'#efeae2',roughness:.45,clearcoat:.3}),g=new THREE.Group();
     const box=new THREE.Mesh(new THREE.BoxGeometry((w-30)*mm,.77,(d-60)*mm),cm);box.position.y=.1+.385;box.castShadow=box.receiveShadow=true;
     const kick=new THREE.Mesh(new THREE.BoxGeometry((w-60)*mm,.1,(d-110)*mm),new THREE.MeshStandardMaterial({color:'#2e2924',roughness:.8}));kick.position.y=.05;
     g.add(box,kick);const doors=Math.max(1,Math.round(w/600)),hm=new THREE.MeshStandardMaterial({color:'#b8b2a8',metalness:1,roughness:.25});
     for(let i=1;i<doors;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.004,.75,.004),new THREE.MeshStandardMaterial({color:'#9d968c'}));s.position.set((-(w-30)/2+i*(w-30)/doors)*mm,.485,(d-60)/2*mm+.002);g.add(s)}
     for(let i=0;i<doors;i++){const h=new THREE.Mesh(new THREE.BoxGeometry(.16,.012,.02),hm);h.position.set((-(w-30)/2+(i+.5)*(w-30)/doors)*mm,.82,(d-60)/2*mm+.012);g.add(h)}
     g.position.set((x0+w/2)*mm,0,(z0+d/2-30)*mm);g.traverse(n=>{n.castShadow=n.receiveShadow=true});root.add(g)}
   }}
  // חדר: רצפת עץ, קיר אחורי וקיר צד, חיפוי
  const W=maxX*mm,D=maxZ*mm,floor=new THREE.Mesh(new THREE.PlaneGeometry(W+6,D+6),new THREE.MeshPhysicalMaterial({color:'#b89a78',roughness:.55,clearcoat:.4,clearcoatRoughness:.3}));
  floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,D/2+1.5);floor.receiveShadow=true;
  const wm=new THREE.MeshStandardMaterial({color:'#f3efe8',roughness:.95}),back=new THREE.Mesh(new THREE.PlaneGeometry(W+6,3),wm);back.position.set(W/2,1.5,-.001);back.receiveShadow=true;
  const sideW=new THREE.Mesh(new THREE.PlaneGeometry(D+6,3),wm);sideW.rotation.y=-Math.PI/2;sideW.position.set(W+.001,1.5,D/2+1.5);sideW.receiveShadow=true;root.add(floor,back,sideW);
  if(cab.checked){const up=new THREE.Mesh(new THREE.BoxGeometry(W*.7,.7,.35),new THREE.MeshPhysicalMaterial({color:'#efeae2',roughness:.45}));up.position.set(W*.35,1.95,.175);up.castShadow=true;root.add(up)}
  sun.position.set(W*.2-1.5,4.5,D+3);sun.target.position.set(W/2,0,D/2);const sc=sun.shadow.camera;sc.left=sc.bottom=-Math.max(W,D);sc.right=sc.top=Math.max(W,D);sc.far=20;sc.updateProjectionMatrix();
  lamps.clear();if(cab.checked)for(let i=0;i<3;i++){const l=new THREE.PointLight('#ffe3b8',.0,3);l.position.set(W*(.2+i*.3),1.55,.25);lamps.add(l)}
  ctl.target.set(W/2,.8,D/2);if(!build.done){cam.position.set(W/2-W*.15,2.6,D+3.2);build.done=1}light();
  const m=res.metrics;$('#mm').innerHTML=[['אבן',stone.name],['לוחות',m.boards],['ניצולת',m.utilization+'%'],['צריכה',m.consumed_m2+' מ"ר']].map(([a,b])=>`<div><small>${a}</small><b>${esc(b)}</b></div>`).join('');
  $('#st8').textContent=base?'':'הטקסטורה לא נטענה';
}
function light(){const v=$('#lt').value;R.toneMappingExposure=v==='warm'?.85:1;sun.color.set(v==='warm'?'#ffc98f':'#ffffff');sun.intensity=v==='studio'?1.2:v==='warm'?1.4:2.2;
  hemi.intensity=v==='studio'?.9:.5;scene.background.set(v==='warm'?'#d9cbb8':'#e9e3da');lamps.children.forEach(l=>l.intensity=v==='warm'?1.6:.4)}
function size(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();$('#st').onchange=build;cab.onchange=build;$('#lt').onchange=light;
$('#shot').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='barstone-render.png';a.click()};
await build();(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam)})();window.__ready=1;
</script>
<script src="js/flow.js?v=7"></script></body></html>

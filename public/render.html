<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>רינדור · Barstone</title><link rel="stylesheet" href="css/studio.css?v=5">
<style>.stage{perspective:1600px;padding:30px 10px 60px;overflow:hidden}.stage>div{transform:rotateX(52deg) rotateZ(-8deg);transform-origin:center;filter:drop-shadow(0 40px 30px rgba(60,48,30,.35))}main{max-width:1000px;margin:auto;padding:16px}</style></head>
<body><header class="top"><img src="logo.png" alt="Barstone"><h1>רינדור הדמיה</h1><span class="sp"></span><a class="btn ghost" href="layout.html" style="text-decoration:none">חזרה לפריסה</a><a class="btn" href="document/document.html" style="text-decoration:none">למסמך ›</a></header>
<main><section class="panel"><h2>תצוגה פרספקטיבית מהפריסה שלך</h2><div class="stage"><div id="r"></div></div><div class="m" id="mm"></div>
<p style="font-size:12px;color:var(--mute)">תצוגה זו נוצרת מהפריסה בפועל — הטקסטורה לכל חלק נלקחת מהמיקום שלו בלוח. רינדור תלת-ממדי פוטוריאליסטי — בפיתוח.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/store.js?v=5"></script><script src="js/engine.js?v=5"></script><script src="js/views.js?v=5"></script>
<script>(async()=>{const S=SimStore,sim=S.getSim();if(!sim||!sim.length_cm){r.innerHTML='<p>אין עדיין הדמיה — <a href="dimensions.html">להתחלה</a></p>';return}
const st=await S.stones(),stone=st.find(s=>String(s.id)===String(sim.stone_id))||st[0],tex=S.texture(stone);
const res=StoneEngine.run(sim,S.getBoards(),{edgeH:sim.edge_mm||40,kerf:sim.kerf_mm||4});res.sim=sim;
r.innerHTML=StoneViews.planSVG(res,tex,Math.min(860,innerWidth-60));const m=res.metrics;
mm.innerHTML=[['אבן',stone.name],['לוחות',m.boards],['ניצולת',m.utilization+'%'],['צריכה',m.consumed_m2+' מ"ר']].map(([a,b])=>`<div><small>${a}</small><b>${StoneViews.esc(b)}</b></div>`).join('')})()</script>
<script src="js/flow.js?v=5"></script></body></html>
